name: SnapStudio CI/CD Pipeline

on:
  push:
    branches: [ main, master, develop ]
  pull_request:
    branches: [ main, master ]
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # =========================================================================
  # 1. Web MVP Prototype QA & Validation
  # =========================================================================
  web-qa-validation:
    name: 🌐 Web Prototype QA & Validation
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Setup Python for Prototype Testing
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install Linting & Testing Tools
        run: |
          npm install -g htmlhint stylelint stylelint-config-standard eslint
          pip install pillow requests

      - name: Validate HTML Structure
        run: |
          htmlhint index.html || echo "HTML validation warnings detected, proceeding..."

      - name: Validate CSS Styling Tokens
        run: |
          echo "Checking Liquid Glass tokens and responsive rules in style.css..."
          grep -q "var(--device-width)" style.css
          grep -q "var(--glass-bg-thin)" style.css

      - name: Run Prototype Integrity Automation Script
        run: |
          python3 scripts/test-prototype.py

      - name: Upload Web Prototype Artifact
        uses: actions/upload-artifact@v4
        with:
          name: snapstudio-web-mvp
          path: |
            index.html
            style.css
            app.js
            model_female.png
            model_male.png
            PLANNING.md
          retention-days: 14

  # =========================================================================
  # 2. GitHub Pages Deployment (Auto Deploy Interactive Preview)
  # =========================================================================
  deploy-github-pages:
    name: 🚀 Deploy Preview to GitHub Pages
    needs: web-qa-validation
    if: github.ref == 'refs/heads/main' || github.ref == 'refs/heads/master'
    runs-on: ubuntu-latest
    permissions:
      contents: write
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Pages
        uses: actions/configure-pages@v4

      - name: Upload Pages Artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: '.'

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4

  # =========================================================================
  # 3. iOS Native CI (SwiftUI / AVFoundation Build & Test)
  # =========================================================================
  ios-native-ci:
    name: 🍎 iOS Native Build & SwiftLint (macOS Runner)
    runs-on: macos-14
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Select Xcode Version
        run: sudo xcode-select -s /Applications/Xcode_15.4.app || sudo xcode-select -s /Applications/Xcode.app

      - name: Verify Xcode & Swift Environment
        run: |
          xcodebuild -version
          swift --version

      - name: Run SwiftLint Check (if available)
        run: |
          if which swiftlint >/dev/null; then
            swiftlint lint --strict || true
          else
            echo "SwiftLint not preinstalled on runner, continuing..."
          fi

      - name: Check iOS Project Structure & Prerequisites
        run: |
          echo "Verifying iOS Native target readiness..."
          if [ -d "SnapStudio-iOS" ]; then
            cd SnapStudio-iOS
            xcodebuild clean build -scheme SnapStudio -destination 'platform=iOS Simulator,name=iPhone 16 Pro' CODE_SIGNING_ALLOWED=NO || true
          else
            echo "iOS native project directory (SnapStudio-iOS) will be compiled upon native code scaffolding."
          fi
