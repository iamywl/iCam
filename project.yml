name: iCam
options:
  bundleIdPrefix: com.icam.snapstudio
  deploymentTarget:
    iOS: "17.0"
  xcodeVersion: "16.0"
  generateEmptyDirectories: true

settings:
  base:
    IPHONEOS_DEPLOYMENT_TARGET: "17.0"
    SWIFT_VERSION: "5.10"
    TARGETED_DEVICE_FAMILY: "1,2" # iPhone, iPad
    PRODUCT_NAME: "iCam"
    PRODUCT_BUNDLE_IDENTIFIER: "com.icam.snapstudio"
    MARKETING_VERSION: "1.0.0"
    CURRENT_PROJECT_VERSION: "1"
    ENABLE_PREVIEWS: "YES"
    CODE_SIGNING_ALLOWED: "NO"
    CODE_SIGNING_REQUIRED: "NO"
    CODE_SIGN_IDENTITY: ""
    DEVELOPMENT_TEAM: ""

targets:
  iCam:
    type: application
    platform: iOS
    deploymentTarget: "17.0"
    sources:
      - path: iCam/Sources/iCamCore
        createIntermediateGroups: true
    info:
      path: iCam/Info.plist
      properties:
        CFBundleDisplayName: "iCam"
        CFBundleIdentifier: "com.icam.snapstudio"
        CFBundleShortVersionString: "1.0.0"
        CFBundleVersion: "1"
        UILaunchScreen: {}
        UISupportedInterfaceOrientations:
          - UIInterfaceOrientationPortrait
        NSCameraUsageDescription: "iCam requires camera access to preview retro camera filters and capture authentic film photos."
        NSPhotoLibraryAddUsageDescription: "iCam requires photo library access to save captured photos and EXIF optics metadata."
        NSPhotoLibraryUsageDescription: "iCam requires photo library access to review and export photos in the gallery."
    settings:
      base:
        INFOPLIST_FILE: "iCam/Info.plist"
        GENERATE_INFOPLIST_FILE: "NO"
        ASSETCATALOG_COMPILER_APPICON_NAME: ""
